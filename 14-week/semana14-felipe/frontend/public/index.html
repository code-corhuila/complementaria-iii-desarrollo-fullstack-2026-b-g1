<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semana 14 · Login con JWT</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- config.js lo genera server.js con la URL de la API -->
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Portal de cursos</h1>
      <p class="subtitle">Semana 14 · Autenticación con JWT</p>
    </header>

    <section id="login-view" class="card" hidden>
      <h2>Iniciar sesión</h2>
      <form id="login-form" novalidate>
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" placeholder="admin" required />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="admin123" required />

        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-btn" type="submit">Entrar</button>
      </form>
      <p class="hint">Demo: <code>admin / admin123</code> o <code>estudiante / clave123</code></p>
    </section>

    <section id="data-view" class="card" hidden>
      <div class="toolbar">
        <p id="welcome"></p>
        <div>
          <button id="reload-btn" type="button" class="secondary">Recargar</button>
          <button id="logout-btn" type="button" class="secondary">Cerrar sesión</button>
        </div>
      </div>
      <p id="data-error" class="error" role="alert" hidden></p>
      <table>
        <thead>
          <tr><th>ID</th><th>Curso</th><th>Docente</th><th>Créditos</th><th>Semestre</th></tr>
        </thead>
        <tbody id="cursos-body"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
