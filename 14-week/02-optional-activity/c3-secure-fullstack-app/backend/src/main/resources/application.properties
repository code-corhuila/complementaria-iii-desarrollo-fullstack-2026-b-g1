# ===== Aplicación =====
spring.application.name=productos-api
server.port=8080

# ===== Base de datos H2 en memoria =====
spring.datasource.url=jdbc:h2:mem:productosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== Consola H2 =====
# Deshabilitada: con seguridad activa la consola H2 no debe quedar expuesta
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Swagger UI / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Seguridad (JWT) =====
# En produccion/Docker estos valores llegan por variables de entorno (.env)
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.user.username=${APP_USERNAME:admin}
app.security.user.password=${APP_PASSWORD:Admin123*}

# ===== CORS =====
# Origenes del frontend separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
